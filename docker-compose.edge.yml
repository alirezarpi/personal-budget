# Run Monat behind an existing edge proxy on the same host: joins the edge's shared
# Docker network so the proxy reaches it as `monat:8765`. Enable it in .env with
#   COMPOSE_FILE=docker-compose.yml:docker-compose.edge.yml
# The edge is responsible for TLS and must overwrite X-Forwarded-For with the client
# address (Monat trusts forwarded headers for its sign-in rate limit).
services:
  monat:
    networks:
      - default
      - edge

networks:
  edge:
    external: true
    name: edge-apps
